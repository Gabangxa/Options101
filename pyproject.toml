[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptoptions"
version = "0.1.0"
description = "Pricing core and scenario engine for buying crypto options on Bybit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cryptoptions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
