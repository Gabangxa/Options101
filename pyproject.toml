[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptoptions"
version = "0.1.0"
description = "Pricing core and scenario engine for buying crypto options on Bybit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
options101 = "cryptoptions.app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptoptions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
